<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suggestiō</title>
  <style>
    body {
      font-family: sans-serif;
    }

    #editor {
      display: block;
      width: 48rem;
      max-width: 100%;
      height: 12rem;
      font: inherit;
      padding: 0.25rem;
    }

    #suggestion-popup {
      position: absolute;
      display: none;
      min-width: 12rem;
      max-height: 16rem;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #777;
      z-index: 10;
    }

    .suggestion {
      padding: 0.15rem 0.5rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .suggestion.selected {
      background: #dde5ff;
    }
  </style>
</head>
<body>
  <label for="editor">Editor</label>
  <textarea id="editor" autofocus></textarea>

  <div id="suggestion-popup"></div>

  <script src="static/app.js"></script>
</body>
</html>
